<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Drama List & Links</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <header>
        <h1>K-Drama Watchlist</h1>
        <p>Lưu tên phim & Link từ Nguonc</p>
    </header>

    <form id="movie-form" class="input-group" novalidate>
        <div class="input-row">
            <label class="sr-only" for="movie-title">Tên phim</label>
            <input type="text" id="movie-title" placeholder="Tên phim (VD: Nàng thơ)" maxlength="200" required autocomplete="off">
        </div>
        <div class="input-row">
            <label class="sr-only" for="movie-link">Liên kết phim</label>
            <input type="text" id="movie-link" inputmode="url" placeholder="Dán link phim từ nguonc.com vào đây" autocomplete="url">
        </div>
        <div class="input-row input-submit-row">
            <button id="add-btn" type="submit">+ Thêm Phim</button>
        </div>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
    </form>

    <ul id="movie-list" aria-label="Danh sách phim"></ul>
    <div id="empty-msg" class="empty-state" hidden>Chưa có phim nào.</div>

    <script src="/app.js" defer></script>
</body>
</html>
